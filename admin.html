<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة الإدارة</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">ⴱ</div>
        <div>
          <h1>لوحة الإدارة - ⵎⵓⵃⵎⵎⴷ barber</h1>
        </div>
      </div>
    </header>

    <section class="card">
      <h3>تسجيل دخول</h3>
      <form id="admin-login">
        <label>المستخدم: <input name="username" /></label>
        <label>كلمة السر: <input name="password" type="password" /></label>
        <div style="margin-top:12px;">
          <button class="btn btn-primary" type="submit">دخول</button>
        </div>
      </form>
    </section>

    <section id="admin-area" class="card" style="display:none;margin-top:12px;">
      <h3>المحتوى الإداري</h3>
      <div id="tabs">
        <!-- تبويبات: إدارة الحجوزات، الإعلان، الحسابات، المديونين، الأيام الملغاة، السجل، الإعدادات -->
        <button class="btn btn-ghost" data-tab="bookings">الحجوزات</button>
        <button class="btn btn-ghost" data-tab="announcements">الإعلانات</button>
        <button class="btn btn-ghost" data-tab="income">الحسابات</button>
        <button class="btn btn-ghost" data-tab="debt">المديونين</button>
        <button class="btn btn-ghost" data-tab="cancelled">الأيام الملغاة</button>
        <button class="btn btn-ghost" data-tab="journal">السجل</button>
        <button class="btn btn-ghost" data-tab="settings">الإعدادات</button>
      </div>
      <div id="tab-content" style="margin-top:12px;"></div>
    </section>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
