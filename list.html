<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salon - Liste des réservations</title>
<link rel="stylesheet" href="css/style.css">
<!-- Supabase JS Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- تطبيقنا -->
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/data-layer.js"></script>
<script src="js/translations.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body>
<header class="site-header">
  <img class="logo" src="logo.png" alt="logo" onclick="openLoginModal()">

  <nav class="nav">
    <a href="annoncent.html"><span data-i18n="nav.announcements">Annonces</span></a>
    <a href="reservation.html"><span data-i18n="nav.reservation">Réservation</span></a>
    <a href="contact.html"><span data-i18n="nav.contact">Contact</span></a>
  </nav>

  <div style="display: flex; gap: 10px; align-items: center; margin-left: auto;">
    <button id="langToggle" onclick="toggleLanguage()" class="lang-btn" style="padding: 8px 12px; font-size: 14px;">العربية</button>
  </div>

  <button class="hamburger" onclick="toggleMobileMenu()" aria-label="Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<!-- Mobile Menu Overlay -->
<div class="mobile-menu-overlay" onclick="closeMobileMenu()"></div>

<!-- Mobile Menu -->
<div class="mobile-menu">
  <nav class="mobile-nav">
    <a href="annoncent.html" onclick="closeMobileMenu()">
      <span>📢</span>
      <span data-i18n="nav.announcements">Annonces</span>
    </a>
    <a href="reservation.html" onclick="closeMobileMenu()">
      <span>📅</span>
      <span data-i18n="nav.reservation">Réservation</span>
    </a>
    <a href="contact.html" onclick="closeMobileMenu()">
      <span>📞</span>
      <span data-i18n="nav.contact">Contact</span>
    </a>
  </nav>

  <div class="mobile-lang-section">
    <button id="mobileLangToggle" onclick="toggleLanguage(); closeMobileMenu();" class="mobile-lang-btn">
      <span>🌐</span>
      <span>العربية</span>
    </button>
  </div>
</div>

<main class="container">
  <section class="card hero">
    <h1 data-i18n="list.title">Liste des réservations</h1>
    <p class="lead" data-i18n="list.subtitle">Qui est prévu et qui est en cours de coupe.</p>
  </section>

  <section class="card">
    <div id="loadingMessage" style="text-align: center; padding: 40px; display: block;">
      <p class="muted" style="font-size: 18px;">🔄 جاري تحميل الحجوزات...</p>
    </div>
    <div id="publicDays"></div>
  </section>
</main>

<div id="loginModal" class="modal hidden">
  <div class="modal-content card">
    <h3 style="color: var(--gold-bright); margin-bottom: 20px;" data-i18n="login.title">Connexion Coiffeur</h3>
    <form onsubmit="event.preventDefault(); doModalLogin();">
      <label data-i18n="login.username">Nom d'utilisateur</label>
      <input id="modalUser" autocomplete="username">
      <label data-i18n="login.password">Mot de passe</label>
      <input id="modalPass" type="password" autocomplete="current-password">
      <div class="actions" style="margin-top: 20px;">
        <button type="submit"><span data-i18n="login.submit">Se connecter</span></button>
        <button type="button" onclick="closeLoginModal()" style="background: rgba(255,255,255,0.1); color: var(--muted); margin-left: 10px;"><span data-i18n="login.close">Fermer</span></button>
      </div>
    </form>
    <p id="modalMsg" class="muted" style="margin-top: 12px;"></p>
  </div>
</div>

<script>
// تحميل بيانات تجريبية
async function loadTestData() {
  if (!confirm('هل تريد إضافة 3 حجوزات تجريبية إلى قاعدة البيانات؟')) return;

  const testBookings = [
    {
      id: 'test_' + Date.now() + '_1',
      name: 'أحمد',
      surname: 'محمد',
      phone: '0555123456',
      dayKey: '2025-10-20',
      dayLabel: 'Dimanche 20/10/2025',
      inProgress: false,
      completed: false,
      createdAt: new Date().toISOString()
    },
    {
      id: 'test_' + Date.now() + '_2',
      name: 'فاطمة',
      surname: 'علي',
      phone: '0666789012',
      dayKey: '2025-10-20',
      dayLabel: 'Dimanche 20/10/2025',
      inProgress: false,
      completed: false,
      createdAt: new Date().toISOString()
    },
    {
      id: 'test_' + Date.now() + '_3',
      name: 'صالح',
      surname: 'بوعزة',
      phone: '0777456123',
      dayKey: '2025-10-23',
      dayLabel: 'Mercredi 23/10/2025',
      inProgress: false,
      completed: false,
      createdAt: new Date().toISOString()
    }
  ];

  try {
    const bookings = load(LS_KEYS.BOOK) || [];
    bookings.push(...testBookings);
    await save(LS_KEYS.BOOK, bookings);
    alert('✅ تم إضافة 3 حجوزات تجريبية بنجاح!');
    location.reload();
  } catch (error) {
    console.error('خطأ في إضافة البيانات:', error);
    alert('❌ حدث خطأ في إضافة البيانات');
  }
}

// ✨ تحديث تلقائي للحجوزات من Supabase
let autoRefreshInterval = null;

async function refreshBookingsFromSupabase() {
  try {
    console.log('🔄 تحديث البيانات من Supabase...');

    // إعادة تحميل البيانات من Supabase
    if (window.supabaseAPI && typeof initDataLayer === 'function') {
      await initDataLayer();
      renderList();
      console.log('✅ تم تحديث البيانات');
    }
  } catch (error) {
    console.error('❌ خطأ في تحديث البيانات:', error);
  }
}

function startAutoRefresh() {
  // تحديث كل 5 ثواني
  autoRefreshInterval = setInterval(refreshBookingsFromSupabase, 5000);
  console.log('🔄 تم تفعيل التحديث التلقائي (كل 5 ثواني)');
}

function stopAutoRefresh() {
  if (autoRefreshInterval) {
    clearInterval(autoRefreshInterval);
    autoRefreshInterval = null;
    console.log('⏸️ تم إيقاف التحديث التلقائي');
  }
}

document.addEventListener('DOMContentLoaded', () => { 
  // الانتظار قليلاً لتحميل البيانات من Supabase
  setTimeout(() => {
    const loadingMsg = document.getElementById('loadingMessage');
    if (loadingMsg) loadingMsg.style.display = 'none';
    
    renderList();

    // بدء التحديث التلقائي
    startAutoRefresh();
  }, 1500);
});

// إيقاف التحديث عند مغادرة الصفحة
window.addEventListener('beforeunload', stopAutoRefresh);
</script>
</body>
</html>
